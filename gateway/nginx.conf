# =============================================================================
# API Gateway / PEP perimetral (Nginx + njs) - imagen nginx-unprivileged
# Se ejecuta sin root, con sistema de ficheros de solo lectura y sin capabilities.
# =============================================================================
load_module modules/ngx_http_js_module.so;

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

# Variables de entorno accesibles desde njs (process.env)
env OIDC_ISSUER;
env OIDC_AUDIENCE;
# JWKS del IdP y endpoint cookie -> token del BFF, ambos a través del servidor
# interno 127.0.0.1:8081 (ver más abajo), que los reenvía por mTLS.
env OIDC_JWKS_URL;
env EXPOSE_DENY_REASONS;
env BFF_TOKEN_URL;

events {
    worker_connections 1024;
}

http {
    # Hardening: ocultar versión para mitigar fingerprinting
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Tipos MIME (necesario para servir la SPA: .js como application/javascript, etc.)
    include /etc/nginx/mime.types;

    client_max_body_size 64k;
    keepalive_timeout 30s;

    # --- Validación JWT con njs ---------------------------------------------
    js_path "/etc/nginx/njs/";
    js_import jwt from jwt.js;
    js_shared_dict_zone zone=jwks:1m timeout=300s;
    js_set $jwt_claimed_sub jwt.claimedSubject;

    # --- Trazabilidad distribuida (W3C Trace Context) ------------------------
    # $request_id (32 hex) es el trace-id; el span del gateway toma sus 16 primeros hex.
    map $request_id $gateway_span_id {
        "~^(?<head>[0-9a-f]{16})" $head;
        default                   "0000000000000001";
    }

    # Authorization hacia el upstream: el token resuelto por el njs (flujo BFF:
    # cookie -> token) tiene prioridad; si no, se reenvía el Bearer del cliente
    # (flujo directo). El navegador con sesión BFF no envía Authorization.
    map $resolved_auth $final_auth {
        ""      $http_authorization;
        default $resolved_auth;
    }

    # --- Upstreams internos (mTLS + HTTP/2, upstream-tls.inc) ----------------
    # Conexiones persistentes: el coste del handshake mTLS se paga una vez por
    # conexión, no por petición. El nombre del upstream coincide con el SAN DNS
    # del SVID del destino, que es lo que verifica proxy_ssl_verify.
    # Re-resolución dinámica (resolve + DNS interno de Docker): si un contenedor se
    # recrea y cambia de IP, el gateway lo sigue sin reiniciarse. Sin ello nginx
    # fija la IP al arrancar y acaba enviando tráfico a otra carga (que el mTLS
    # rechaza con "upstream SSL certificate does not match" -> 502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    upstream orders-service    { zone up_orders 64k;    server orders-service:8443 resolve;    keepalive 16; }
    upstream inventory-service { zone up_inventory 64k; server inventory-service:8443 resolve; keepalive 16; }
    upstream trace-service     { zone up_traces 64k;    server trace-service:8443 resolve;     keepalive 8; }
    upstream bff               { zone up_bff 64k;       server bff:8443 resolve;               keepalive 8; }
    upstream keycloak          { zone up_keycloak 64k;  server keycloak:8443 resolve;          keepalive 16; }

    # --- Rate limiting perimetral (memoria 5.1) -----------------------------
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_status 429;

    # --- Log estructurado JSON para trazabilidad / SIEM (RU-06) -------------
    log_format json_combined escape=json
      '{"time":"$time_iso8601",'
      '"request_id":"$request_id",'
      '"remote_addr":"$remote_addr",'
      '"method":"$request_method",'
      '"uri":"$uri",'
      '"status":$status,'
      '"sub":"$jwt_claimed_sub",'
      '"edge":"$edge_auth",'
      '"upstream":"$upstream_addr",'
      '"request_time":$request_time,'
      '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout json_combined;

    # --- Servidor interno para el njs (solo 127.0.0.1) -------------------------
    # ngx.fetch no puede presentar certificado de cliente: el njs consulta aquí y
    # este bloque reenvía por mTLS con el SVID del gateway. No es alcanzable desde
    # fuera del contenedor.
    server {
        listen 127.0.0.1:8081;
        access_log off;

        location = /_internal/jwks {
            proxy_pass https://keycloak/auth/realms/tfm/protocol/openid-connect/certs;
            include upstream-tls.inc;
        }
        # La cookie de sesión del navegador viaja en la cabecera Cookie de ngx.fetch.
        location = /_internal/bff-token {
            proxy_pass https://bff/bff/token;
            include upstream-tls.inc;
        }
        location / {
            return 404;
        }
    }

    # --- Redirección obligatoria HTTP -> HTTPS -------------------------------
    server {
        listen 8080;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost api-gateway;

        ssl_certificate     /etc/nginx/certs/gateway.crt;
        ssl_certificate_key /etc/nginx/certs/gateway.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        # Cabeceras de seguridad perimetral
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Request-ID $request_id always;

        # Respuesta homogénea ante fallos de autenticación perimetral
        error_page 401 = @unauthorized;
        location @unauthorized {
            js_content jwt.unauthorized;
        }

        # Subpetición interna de autenticación (auth_request): Bearer directo o
        # sesión BFF (cookie -> token). Puede inyectar X-Resolved-Auth.
        location = /_api_auth {
            internal;
            js_content jwt.apiAuth;
        }

        # --- Proveedor de identidades (Keycloak) ------------------------------
        location /auth/ {
            include keycloak-proxy.inc;
        }

        # Rate limiting solo en los endpoints que reciben credenciales (mitigación de
        # fuerza bruta en el borde, complementaria a la de Keycloak). No se aplica al
        # resto de /auth/: la consola de administración descarga decenas de módulos JS
        # en paralelo y un límite global provoca 429 al cargarla.
        location ~ ^/auth/realms/[^/]+/(protocol/openid-connect/token|login-actions/) {
            limit_req zone=auth burst=20 nodelay;
            include keycloak-proxy.inc;
        }

        # --- Rutas de negocio protegidas: autenticación en el borde -----------
        # El token de usuario llega al primer servicio (su audiencia es la API de
        # borde); a partir de ahí cada salto usa un token delegado (Token Exchange).
        location /api/v1/orders {
            limit_req zone=api burst=100 nodelay;
            auth_request /_api_auth;
            auth_request_set $edge_auth $sent_http_x_edge_auth;
            auth_request_set $resolved_auth $sent_http_x_resolved_auth;
            proxy_pass https://orders-service;
            include proxy-common.inc;
        }

        location /api/v1/admin/ {
            limit_req zone=api burst=20 nodelay;
            auth_request /_api_auth;
            auth_request_set $edge_auth $sent_http_x_edge_auth;
            auth_request_set $resolved_auth $sent_http_x_resolved_auth;
            proxy_pass https://orders-service;
            include proxy-common.inc;
        }

        location /api/v1/inventory {
            limit_req zone=api burst=100 nodelay;
            auth_request /_api_auth;
            auth_request_set $edge_auth $sent_http_x_edge_auth;
            auth_request_set $resolved_auth $sent_http_x_resolved_auth;
            proxy_pass https://inventory-service;
            include proxy-common.inc;
        }

        location /api/v1/traces/ {
            limit_req zone=api burst=100 nodelay;
            auth_request /_api_auth;
            auth_request_set $edge_auth $sent_http_x_edge_auth;
            auth_request_set $resolved_auth $sent_http_x_resolved_auth;
            proxy_pass https://trace-service;
            include proxy-common.inc;
        }

        # --- BFF / Token Handler ----------------------------------------------
        # El endpoint interno /bff/token (cookie -> token) NO se publica: solo lo
        # consume el njs por la red interna. Un cliente externo no puede pedirlo.
        location = /bff/token {
            default_type application/json;
            return 404 '{"error":"not_found"}';
        }
        location /bff/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass https://bff;
            include upstream-tls.inc;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            add_header X-Request-ID $request_id always;
        }

        # --- Consola de demostración (SPA estática, pública) ------------------
        # Se sirve desde el mismo origen que la API y Keycloak: sin CORS. No lleva
        # auth_request (la página es pública; las llamadas a /api/v1/* que hace el
        # navegador portan Bearer o la cookie de sesión BFF y se validan en su location).
        location = / {
            return 302 /app/;
        }
        location /app/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /app/index.html;
        }

        # Pagos y rutas /internal/* no se publican: solo son accesibles M2M
        # dentro de la red backend. Todo lo no declarado se deniega.
        location / {
            default_type application/json;
            return 404 '{"error":"not_found"}';
        }
    }
}
